name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  domain-and-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/domain
      - run: cargo test --manifest-path src-tauri/domain/Cargo.toml
      - run: cargo build --manifest-path src-tauri/domain/Cargo.toml --bin domain-runner
      - uses: actions/upload-artifact@v4
        with:
          name: domain-runner-${{ github.run_id }}
          path: |
            src-tauri/domain/target/debug/domain-runner
            src-tauri/domain/Cargo.lock
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-receipts.mjs
        env:
          GAS_PLAYWRIGHT_MODULE: playwright
      - run: node tests/browser-audit.mjs
        env:
          GAS_PLAYWRIGHT_MODULE: playwright
      - run: node tests/browser-backup.mjs
        env:
          GAS_PLAYWRIGHT_MODULE: playwright
      - run: node tests/browser-refunds.mjs
        env:
          GAS_PLAYWRIGHT_MODULE: playwright
      - run: node tests/browser-suppliers.mjs
        env:
          GAS_PLAYWRIGHT_MODULE: playwright
      - run: node tests/browser-expenses.mjs
        env:
          GAS_PLAYWRIGHT_MODULE: playwright
      - run: node tests/browser-reports.mjs
        env:
          GAS_PLAYWRIGHT_MODULE: playwright
      - run: node tests/browser-dashboard.mjs
        env:
          GAS_PLAYWRIGHT_MODULE: playwright
      - run: node tests/browser-operations.mjs
        env:
          GAS_PLAYWRIGHT_MODULE: playwright
      - run: node tests/browser-nilson.mjs
        env:
          GAS_PLAYWRIGHT_MODULE: playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: tmp/screenshots/
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Build previous release for upgrade validation
        shell: pwsh
        run: |
          git fetch --depth=1 origin 4a70cd484138c83582749af36f104412ee466aeb
          $legacyDir = Join-Path $env:RUNNER_TEMP 'gs-legacy-source'
          git worktree add --detach $legacyDir 4a70cd484138c83582749af36f104412ee466aeb
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target'
          Push-Location $legacyDir
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Legacy npm ci failed' }
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Legacy installer build failed' }
          Pop-Location
          $legacySetup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          Copy-Item $legacySetup.FullName (Join-Path $env:RUNNER_TEMP 'gs-legacy-setup.exe')
          Remove-Item $legacySetup.FullName
      - run: npm ci
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/domain/Cargo.toml --target-dir src-tauri/target
      - run: cargo build --manifest-path src-tauri/domain/Cargo.toml --target-dir src-tauri/target --bin domain-runner
      - run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
      - run: ./tests/windows-installer-smoke.ps1
        shell: pwsh
