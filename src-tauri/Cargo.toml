[package]
name = "gs_deposito"
version = "0.1.0"
description = "Sistema offline para gestão de depósito"
authors = ["G-s-"]
edition = "2021"

[lib]
name = "gs_deposito_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "=2.5.0", features = ["sqlite"] }
tauri-plugin-dialog = "2"

deposito-domain = { path = "domain" }
